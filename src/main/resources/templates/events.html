<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Events - SocialNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .event-item {
            cursor: pointer;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border-left: 4px solid transparent;
            transition: 0.15s;
        }
        .event-item:hover { background: #eef2f7; }
        .event-item.active {
            background: var(--clr-blue);
            color: white;
            border-left-color: #fff;
        }
        .event-item-title { font-weight: 600; }
        .event-item-meta { font-size: 0.85rem; color: #6c757d; }
        .event-item.active .event-item-meta { color: rgba(255,255,255,0.8); }
        .badge-pill { display: inline-block; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-count { background: #e9ecef; color: #333; }
        .badge-registered { background: #d4edda; color: #155724; }
        .badge-not-registered { background: #f8d7da; color: #721c24; }
        .badge-past { background: #e2e3e5; color: #383d41; }
        .filter-toggle .btn.active { background: var(--clr-blue); color: white; border-color: var(--clr-blue); }
        .filter-toggle .btn { border-color: #ced4da; color: #333; }
        .detail-panel { min-height: 300px; }
        .detail-panel .empty-state { color: #6c757d; font-style: italic; padding: 2rem 0; text-align: center; }
        #event-registrants { max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
<div id="app-wrapper">
    <header id="app-header">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <h1 id="app-title" class="mb-0">
                LBYCPOB SocialNet - Events
            </h1>
            <nav>
                <a href="/" style="color:white;font-size:0.9rem;margin-right:1rem;text-decoration:none;">Profile</a>
                <a href="/organizations" style="color:white;font-size:0.9rem;margin-right:1rem;text-decoration:none;">Organizations</a>
                <a href="/events" style="color:white;font-size:0.9rem;font-weight:bold;text-decoration:none;">Events</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="container-fluid py-3">
        <div class="row g-3">
            <div class="col-md-5">
                <div class="sn-panel h-100">
                    <h5 class="panel-heading">Your Name</h5>
                    <input type="text" id="input-my-name" class="form-control sn-input mb-2" placeholder="Enter your profile name">
                    <small class="text-muted">Type your name to check registration status.</small>
                    <hr>
                    <h5 class="panel-heading">Events</h5>
                    <div class="filter-toggle mb-2">
                        <button class="btn btn-sm active" data-scope="all">All</button>
                        <button class="btn btn-sm" data-scope="upcoming">Upcoming</button>
                        <button class="btn btn-sm" data-scope="next-two-weeks">Next 2 Weeks</button>
                    </div>
                    <div id="event-list" class="profile-list-box" style="height:400px; overflow-y:auto;">
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="sn-panel sn-panel--bordered h-100 detail-panel">
                    <h5 class="panel-heading">Event Details</h5>
                    <div id="event-detail-content">
                        <h3 id="event-title">No Event Selected</h3>
                        <div id="event-badges" class="mb-2"></div>
                        <p id="event-when-where">&mdash;</p>
                        <p id="event-description">&mdash;</p>
                        <hr>
                        <h6>Registrants</h6>
                        <div id="event-registrants" class="sn-textbox sn-textbox--tall">
                            <p class="empty-state">Select an event to see registrants.</p>
                        </div>
                        <div class="mt-3">
                            <button id="btn-register" class="btn sn-btn-green me-2">Register</button>
                            <button id="btn-cancel" class="btn sn-btn-red">Cancel Registration</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="status-bar">
        <span id="status-message">Ready. Enter your profile name and pick an event.</span>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/events.js}" src="/js/events.js"></script>
</body>
</html>
